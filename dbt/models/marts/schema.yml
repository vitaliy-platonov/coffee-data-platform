version: 2

models:
  - name: sales_mart
    description: "Daily sales metrics by store."

    columns:
      - name: sale_date
        description: "Date of sales."
        tests:
          - not_null

      - name: store_id
        description: "Store identifier."
        tests:
          - not_null

      - name: store_name
        description: "Store name."
        tests:
          - not_null

      - name: orders_count
        description: "Number of orders for the store and date."
        tests:
          - not_null

      - name: revenue
        description: "Total revenue for the store and date."
        tests:
          - not_null

      - name: average_check
        description: "Average order value for the store and date."
        tests:
          - not_null

  - name: customer_mart
    description: "Customer-level sales metrics."

    columns:
      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null

      - name: first_name
        description: "Customer first name."
        tests:
          - not_null

      - name: last_name
        description: "Customer last name."
        tests:
          - not_null

      - name: registration_date
        description: "Customer registration date."
        tests:
          - not_null

      - name: orders_count
        description: "Number of orders placed by the customer."
        tests:
          - not_null

      - name: total_spent
        description: "Total amount spent by the customer."
        tests:
          - not_null

      - name: average_check
        description: "Average order value for the customer."
        tests:
          - not_null

  - name: product_mart
    description: "Product-level sales metrics."

    columns:
      - name: product_id
        description: "Product identifier."
        tests:
          - not_null

      - name: product_name
        description: "Product name."
        tests:
          - not_null

      - name: category_name
        description: "Product category name."
        tests:
          - not_null

      - name: orders_count
        description: "Number of orders containing the product."
        tests:
          - not_null

      - name: quantity_sold
        description: "Total quantity sold."
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by the product."
        tests:
          - not_null

  - name: store_mart
    description: "Store-level sales metrics."

    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null

      - name: store_name
        description: "Store name."
        tests:
          - not_null

      - name: region
        description: "Store region."
        tests:
          - not_null

      - name: orders_count
        description: "Number of orders for the store."
        tests:
          - not_null

      - name: customers_count
        description: "Number of unique customers for the store."
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by the store."
        tests:
          - not_null

      - name: average_check
        description: "Average order value for the store."
        tests:
          - not_null
